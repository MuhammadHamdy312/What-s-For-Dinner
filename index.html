<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's For Dinner</title>
  <link rel="icon" href="./favicon.png" />

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="assets/bootstrap.min.css" />

  <!-- Custom Override CSS -->
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>

  <!-- Header / Navigation Bar -->
  <header id="header" class="py-3">
    <div class="container px-3 px-md-4">
      <div class="d-flex align-items-center justify-content-between">

        <!-- Logo and Site Name -->
        <div class="d-flex align-items-center gap-3">
          <div class="brand-icon d-flex align-items-center justify-content-center flex-shrink-0">
            <i class="fa-solid fa-utensils text-white fs-5"></i>
          </div>
          <div>
            <h1 class="fs-4 fs-md-2 fs-lg-1 fw-bolder text-dark mb-0">What's For Dinner</h1>
            <p class="text-secondary mb-0" style="font-size: 0.90em;">Your daily meal inspiration</p>
          </div>
        </div>

        <!-- Desktop Navigation Actions (Screens >= md) -->
        <div class="d-none d-md-flex align-items-center gap-2">
          <button class="nav-action-btn" title="Saved Recipes" aria-label="Saved Recipes">
            <i class="fa-solid fa-bookmark"></i>
          </button>
          <button class="nav-action-btn" title="Recent History" aria-label="Recent History">
            <i class="fa-solid fa-clock-rotate-left"></i>
          </button>
          <button class="nav-action-btn" title="Settings" aria-label="Settings">
            <i class="fa-solid fa-gear"></i>
          </button>
          <img src="images/avatar-4.jpg" alt="Profile Avatar" class="profile-avatar-img" />
        </div>

        <!-- Mobile Menu Toggle Button-->
        <button id="mobile-menu-btn" class="d-md-none border-0 bg-transparent text-secondary fs-3 p-1" type="button"
          data-bs-toggle="collapse" data-bs-target="#mobile-menu" aria-expanded="false" aria-controls="mobile-menu"
          aria-label="Toggle Navigation">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <!-- Collapsible Mobile Navigation Menu -->
      <div class="d-md-none mt-3 pt-3 border-buttom-mobile" id="mobile-menu">
        <div class="d-flex flex-column gap-2 pb-2">
          <button class="mobile-nav-btn">
            <i class="fa-solid fa-bookmark fs-5 me-3 text-secondary"></i>
            <span>Saved Recipes</span>
          </button>
          <button class="mobile-nav-btn">
            <i class="fa-solid fa-clock-rotate-left fs-5 me-3 text-secondary"></i>
            <span>Recent</span>
          </button>
          <button class="mobile-nav-btn">
            <i class="fa-solid fa-gear fs-5 me-3 text-secondary"></i>
            <span>Settings</span>
          </button>
          <button class="mobile-nav-btn">
            <img src="images/avatar-4.jpg" alt="Profile" class="rounded-circle border border-2 border-warning me-3"
              width="32" height="32" />
            <span>Profile</span>
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Main Content Area -->
  <main id="main-content" class="container py-4 py-md-4 px-3 px-md-4">

    <!-- Recipe Display Section Card -->
    <section id="recipe-display-section" class="mb-5">
      <div class="row g-0 recipe-main-row">

        <!-- Left Column: Recipe Image, Floating Rating & Preparation Info Card -->
        <div class="col-12 col-lg-5 position-relative overflow-hidden recipe-image-container">
          <img id="recipe-image" src="" alt="" />

          <!-- Floating Rating Badge -->
          <div class="rating-badge">
            <i class="fa-solid fa-star text-warning"></i>
            <span class="fw-bold text-dark small" id="rating-average"></span>
            <span class="text-secondary small" id="rating-quantity"></span>
          </div>

          <!-- Floating Preparation Info Glass Card -->
          <div class="prep-info-card">
            <div class="row g-2 text-center">
              <div class="col-4">
                <i class="fa-solid fa-clock warning-dark fs-5 mb-1 d-block"></i>
                <span class="text-secondary d-block" style="font-size: 0.75rem;">Prep Time</span>
                <span class="fw-bold text-dark small" id="prep-time-display"></span>
              </div>
              <div class="col-4">
                <i class="fa-solid fa-fire-burner text-danger fs-5 mb-1 d-block"></i>
                <span class="text-secondary d-block" style="font-size: 0.75rem;">Cook Time</span>
                <span class="fw-bold text-dark small" id="cook-time-display"></span>
              </div>
              <div class="col-4">
                <i class="fa-solid fa-users text-primary fs-5 mb-1 d-block"></i>
                <span class="text-secondary d-block" style="font-size: 0.75rem;">Servings</span>
                <span class="fw-bold text-dark small" id="servings-display"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column Recipe Details, Warning, Tabs-->
        <div class="col-12 col-lg-7 recipe-content-scroll p-4 p-lg-5 d-flex flex-column justify-content-between">
          <div>

            <div
              class="d-flex flex-column-reverse flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">

              <div>
                <div class="d-flex align-items-center gap-2 mb-2">
                  <span class="badge-difficulty" id="difficulty-badge"></span>
                  <span class="badge-category" id="category-badge"></span>
                </div>
                <h2 class="fs-2 fs-sm-5 fs-md-3 fs-lg-1 fw-bolder text-dark mb-2" id="recipe-name"></h2>
                <p class="text-secondary mb-0 small" id="recipe-description"></p>
              </div>


              <div class="d-flex align-items-center gap-2 align-self-end align-self-md-start">
                <button class="recipe-action-btn">
                  <i class="fa-solid fa-bookmark"></i>
                </button>
                <button class="recipe-action-btn">
                  <i class="fa-solid fa-share-nodes"></i>
                </button>
              </div>

            </div>

            <!-- Extended Preparation Time Warning Hidden by default for <= 45 mins -->
            <div id="time-warning" class="d-none p-3 mb-4">
              <div class="d-flex align-items-center">
                <i class="fa-solid fa-triangle-exclamation text-danger fs-4 me-3"></i>
                <div>
                  <h6 class="fw-bold text-danger-dark mb-1">Extended Preparation Time</h6>
                  <p class="text-danger small mb-0">This recipe requires more than 45 minutes to prepare. Plan
                    accordingly!</p>
                </div>
              </div>
            </div>

            <!-- Recipe Tabs Navigation -->
            <ul class="nav nav-tabs recipe-nav-tabs mb-3 mb-md-4 d-flex flex-nowrap" id="recipeTabs" role="tablist">
              <li class="nav-item flex-fill text-center" role="presentation">
                <button class="nav-link w-100 active py-2 py-md-3 px-1 px-md-3" id="tab-btn-ingredients"
                  data-bs-toggle="tab" data-bs-target="#ingredients-tab" data-tab="ingredients" type="button" role="tab"
                  aria-controls="ingredients-tab" aria-selected="true">
                  <i class="fa-solid fa-list-check me-1 small"></i>
                  <span class="small">Ingredients</span>
                </button>
              </li>
              <li class="nav-item flex-fill text-center" role="presentation">
                <button class="nav-link w-100 py-2 py-md-3 px-1 px-md-3" id="tab-btn-instructions" data-bs-toggle="tab"
                  data-bs-target="#instructions-tab" data-tab="instructions" type="button" role="tab"
                  aria-controls="instructions-tab" aria-selected="false">
                  <i class="fa-solid fa-book-open me-1 small"></i>
                  <span class="small">Instructions</span>
                </button>
              </li>
              <li class="nav-item flex-fill text-center" role="presentation">
                <button class="nav-link w-100 py-2 py-md-3 px-1 px-md-3" id="tab-btn-nutrition" data-bs-toggle="tab"
                  data-bs-target="#nutrition-tab" data-tab="nutrition" type="button" role="tab"
                  aria-controls="nutrition-tab" aria-selected="false">
                  <i class="fa-solid fa-chart-pie me-1 small"></i>
                  <span class="small">Nutrition</span>
                </button>
              </li>
              <li class="nav-item flex-fill text-center" role="presentation">
                <button class="nav-link w-100 py-2 py-md-3 px-1 px-md-3" id="tab-btn-tips" data-bs-toggle="tab"
                  data-bs-target="#tips-tab" data-tab="tips" type="button" role="tab" aria-controls="tips-tab"
                  aria-selected="false">
                  <i class="fa-solid fa-lightbulb me-1 small"></i>
                  <span class="small">Chef's Tips</span>
                </button>
              </li>
            </ul>

            <!-- Tab Content Panes -->
            <div class="tab-content" id="recipeTabContent">

              <!-- Tab 1: Ingredients -->
              <div class="tab-pane fade show active tab-scroll-body" id="ingredients-tab" role="tabpanel"
                aria-labelledby="tab-btn-ingredients">
                <div class="ingredients-box">
                  <ul class="list-unstyled d-flex flex-column gap-3 mb-0" id="ingredients-list">
                  </ul>
                </div>
              </div>

              <!-- Tab 2: Instructions -->
              <div class="tab-pane fade tab-scroll-body" id="instructions-tab" role="tabpanel"
                aria-labelledby="tab-btn-instructions">
                <div class="d-flex flex-column gap-4" id="instructions-list">

                </div>
              </div>

              <!-- Tab 3: Nutrition -->
              <div class="tab-pane fade" id="nutrition-tab" role="tabpanel" aria-labelledby="tab-btn-nutrition">
                <div class="row g-2 g-md-3" id="nutrition-grid">
                  <div class="col-6 col-md-6">
                    <div class="nutrition-card d-flex align-items-center justify-content-between">
                      <div class="d-flex align-items-center gap-2 gap-md-3">
                        <div class="nutrition-icon-wrapper" style="background-color: #ffedd5; color: #ea580c;">
                          <i class="fa-solid fa-fire"></i>
                        </div>
                        <span class="text-secondary fw-bold ">Calories</span>
                      </div>
                      <span class="fw-bold text-dark fs-5" id="calories-value"></span>
                    </div>
                  </div>
                  <div class="col-6 col-md-6">
                    <div class="nutrition-card d-flex align-items-center justify-content-between">
                      <div class="d-flex align-items-center gap-2 gap-md-3">
                        <div class="nutrition-icon-wrapper" style="background-color: #dbeafe; color: #2563eb;">
                          <i class="fa-solid fa-dumbbell"></i>
                        </div>
                        <span class="text-secondary fw-bold ">Protein</span>
                      </div>
                      <span class="fw-bold text-dark fs-5" id="protein-value"></span>
                    </div>
                  </div>
                  <div class="col-6 col-md-6">
                    <div class="nutrition-card d-flex align-items-center justify-content-between">
                      <div class="d-flex align-items-center gap-2 gap-md-3">
                        <div class="nutrition-icon-wrapper" style="background-color: #fef9c3; color: #ca8a04;">
                          <i class="fa-solid fa-wheat-awn"></i>
                        </div>
                        <span class="text-secondary fw-bold ">Carbs</span>
                      </div>
                      <span class="fw-bold text-dark fs-5" id="carbs-value"></span>
                    </div>
                  </div>
                  <div class="col-6 col-md-6">
                    <div class="nutrition-card d-flex align-items-center justify-content-between">
                      <div class="d-flex align-items-center gap-2 gap-md-3">
                        <div class="nutrition-icon-wrapper" style="background-color: #fee2e2; color: #dc2626;">
                          <i class="fa-solid fa-droplet"></i>
                        </div>
                        <span class="text-secondary fw-bold ">Fat</span>
                      </div>
                      <span class="fw-bold text-dark fs-5" id="fat-value"></span>
                    </div>
                  </div>
                  <div class="col-6 col-md-6">
                    <div class="nutrition-card d-flex align-items-center justify-content-between">
                      <div class="d-flex align-items-center gap-2 gap-md-3">
                        <div class="nutrition-icon-wrapper" style="background-color: #dcfce7; color: #16a34a;">
                          <i class="fa-solid fa-seedling"></i>
                        </div>
                        <span class="text-secondary fw-bold ">Fiber</span>
                      </div>
                      <span class="fw-bold text-dark fs-5" id="fiber-value"></span>
                    </div>
                  </div>
                  <div class="col-6 col-md-6">
                    <div class="nutrition-card d-flex align-items-center justify-content-between">
                      <div class="d-flex align-items-center gap-2 gap-md-3">
                        <div class="nutrition-icon-wrapper" style="background-color: #fce7f3; color: #db2777;">
                          <i class="fa-solid fa-cube"></i>
                        </div>
                        <span class="text-secondary fw-bold ">Sodium</span>
                      </div>
                      <span class="fw-bold text-dark fs-5" id="sodium-value"></span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Tab 4: Chef's Tips -->
              <div class="tab-pane fade tab-scroll-body" id="tips-tab" role="tabpanel" aria-labelledby="tab-btn-tips">
                <div class="d-flex flex-column gap-3" id="tips-list">

                </div>
              </div>

            </div>

          </div>

          <!-- Bottom Action Area -->
          <div class="mt-4 pt-4 border-top">
            <button id="random-btn" onclick="displayRecipe();" type="button">
              <i class="fa-solid fa-rotate me-2"></i>
              <span>Try Another Recipe</span>
            </button>
          </div>

        </div>

      </div>
    </section>

  </main>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="assets/bootstrap.bundle.min.js"></script>

  <!-- User's Custom JavaScript file -->
  <script src="assets/js.js"></script>
</body>

</html>
